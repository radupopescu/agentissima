[project]
name = "interview"
version = "0.1.0"
description = "Agent benchmark for local LLMs on Apple silicon, per doc/benchmark.md"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0",
    "openai>=1.40",
    "gguf>=0.19.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
